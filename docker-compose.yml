services:
  app:
    build: .
    container_name: ivygpt-app
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ivygpt
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: http://localhost:8080
      CORS_ALLOW_ORIGINS: http://localhost:8080
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-a-long-random-secret}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-3.8-flash}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@ivygpt.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-IvyGPT}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      RUN_MIGRATIONS: "true"
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      ivygpt-network:

  worker:
    build: .
    container_name: ivygpt-worker
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ivygpt
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: http://localhost:8080
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-a-long-random-secret}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-3.8-flash}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@ivygpt.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-IvyGPT}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      RUN_MIGRATIONS: "false"
    command: ["celery", "-A", "ivy_gpt.services.email_tasks.celery_app", "worker", "--loglevel=info", "--pool=solo"]
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      ivygpt-network:

  postgres:
    image: postgres:16
    container_name: ivygpt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ivygpt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ivygpt"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      ivygpt-network:
        aliases:
          - postgres
          - ivygpt-postgres

  redis:
    image: redis:7
    container_name: ivygpt-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      ivygpt-network:
        aliases:
          - redis
          - ivygpt-redis

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  chroma_data:

networks:
  ivygpt-network:
    name: ivygpt-network
